name: ساخت صدای هوهو

# Generates a voice file for every line in res/raw/audio_manifest.txt and commits them,
# so the lessons ship with a real recorded narration instead of the device's own voice.
# Run it by hand from the Actions tab whenever the lesson text changes.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'صدا'
        default: 'fa-IR-DilaraNeural'
        type: choice
        options:
          - fa-IR-DilaraNeural
          - fa-IR-FaridNeural
      rate:
        description: 'سرعت گفتار'
        default: '-8%'
      force:
        description: 'فایل‌های موجود هم دوباره ساخته شوند'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts and ffmpeg
        run: |
          python -m pip install --quiet edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # --rate=-8% must use the equals form: argparse reads a bare "-8%" as another flag
      - name: Generate the narration
        run: |
          set -o pipefail
          python3 tools/make_voice.py \
            "--voice=${{ inputs.voice }}" \
            "--rate=${{ inputs.rate }}" \
            ${{ inputs.force && '--force' || '' }} 2>&1 | tee voice-run.log

      # CI logs live on storage this project's author cannot reach, so failures are
      # reported back as an issue instead of disappearing into the run.
      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "ساخت فایل‌های صوتی شکست خورد."
            echo
            echo '```'
            tail -c 30000 voice-run.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > issue.md
          gh issue create --title "ساخت صدای هوهو شکست خورد" --body-file issue.md

      - name: Commit the audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/ project/voice_spoken.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          count=$(git diff --cached --name-only | grep -c 'res/raw/' || true)
          git commit -m "صدای هوهو: $count فایل گفتار با ${{ inputs.voice }}"
          # the APK build may have pushed meanwhile; rebase onto it instead of losing the audio
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            sleep 10
          done
          exit 1
