name: ساخت APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      make_voice:
        description: "فایل‌های صوتیِ نداشته را هم بساز (پیش‌فرض: نه — صداها دستی اضافه می‌شوند)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read the version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=hoohoo-farsi-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "نسخه: $VERSION"

      # Off by default: the narration files are added by hand, and until they are there the app
      # reads the manifest's spoken column with the device voice. Tick «make_voice» on a manual
      # run to have the runner fill in whatever is missing (make_voice.py skips existing files).
      - name: Generate any missing narration
        if: ${{ inputs.make_voice == true }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 tools/make_voice.py "--rate=-8%" 2>&1 | tail -n 40 | tee voice-run.log

      # the compiler's own words go into the log the failure issue quotes, since Actions logs
      # cannot be read from the dev environment
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then grep -E "error:|e: |FAILED|What went wrong" -A3 /tmp/build.log | head -c 3500 > /tmp/release.log; fi
          exit $status

      # Two names on purpose: a versioned one for the permanent release, and a fixed
      # "hoohoo-farsi.apk" so the download link on the latest release never changes.
      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.apk }}"
          cp app/build/outputs/apk/debug/app-debug.apk dist/hoohoo-farsi.apk
          ls -lh dist/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoohoo-farsi-${{ steps.version.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      # The built APK is committed to the repo (dist/) so it can be grabbed straight
      # from the file tree, and tagged as a release so every version stays downloadable.
      - name: Commit the APK into the repo
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/hoohoo-farsi.apk app/src/main/res/raw/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            voices=$(git diff --cached --name-only | grep -c 'res/raw/.*\.ogg' || true)
            git commit -m "APK نسخه‌ی ${{ steps.version.outputs.version }}${voices:+ (+$voices فایل گفتار)}"
            git pull --rebase --autostash origin master || true
            git push
          fi

      # The fixed «latest» release is edited in place rather than deleted and recreated —
      # deleting the tag and immediately creating it again raced with GitHub and failed the
      # publish (the APK itself had already built and been committed).
      - name: Tag and publish the release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          publish() {
            V="${{ steps.version.outputs.version }}"
            APK="dist/${{ steps.version.outputs.apk }}"
            NOTES="نسخه‌ی $V — ساخته‌شده از ${GITHUB_SHA::7}. نسخه‌ی دیباگ، مستقیم روی گوشی یا تبلت نصب می‌شود."

            # a permanent release per version…
            if gh release view "v$V" >/dev/null 2>&1; then
              gh release upload "v$V" "$APK" --clobber
            else
              gh release create "v$V" "$APK" --title "نسخه‌ی $V" --notes "$NOTES"
            fi

            # …and the fixed address the app is always published to:
            #   github.com/<repo>/releases/tag/latest
            #   github.com/<repo>/releases/download/latest/hoohoo-farsi.apk
            if gh release view latest >/dev/null 2>&1; then
              # drop the previous version's file so «latest» only ever carries the current one
              gh release view latest --json assets --jq '.assets[].name' \
                | grep -E '^hoohoo-farsi-.*\.apk$' \
                | grep -v -F "hoohoo-farsi-$V.apk" \
                | while read -r stale; do gh release delete-asset latest "$stale" --yes || true; done
              gh release upload latest dist/hoohoo-farsi.apk "$APK" --clobber
              gh release edit latest --title "آخرین نسخه ($V)" --notes "$NOTES" --prerelease
            else
              gh release create latest dist/hoohoo-farsi.apk "$APK" \
                --title "آخرین نسخه ($V)" --notes "$NOTES" --prerelease
            fi
          }

          for attempt in 1 2 3; do
            if publish 2>&1 | tee -a /tmp/release.log; then
              exit 0
            fi
            echo "تلاش $attempt ناموفق بود؛ ۱۵ ثانیه صبر می‌کنم." | tee -a /tmp/release.log
            sleep 15
          done
          exit 1

      # Actions logs live on storage the dev environment cannot reach, so a failed publish
      # writes its own reason somewhere readable: an issue.
      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 4000 /tmp/release.log 2>/dev/null || echo "بدون لاگ")
          gh issue create \
            --title "انتشار نسخه‌ی ${{ steps.version.outputs.version }} ناموفق بود" \
            --body "$(printf 'ران: %s\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$TAIL")" || true
