name: ساخت APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      make_voice:
        description: "فایل‌های صوتیِ نداشته را هم بساز (پیش‌فرض: نه — صداها دستی اضافه می‌شوند)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # recording four thousand narration lines takes a while

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read the version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=hoohoo-farsi-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "نسخه: $VERSION"

      # Off by default: the narration files are added by hand, and until they are there the app
      # reads the manifest's spoken column with the device voice. Tick «make_voice» on a manual
      # run to have the runner fill in whatever is missing (make_voice.py skips existing files).
      - name: Generate any missing narration
        if: ${{ inputs.make_voice == true }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 tools/make_voice.py "--rate=-8%" 2>&1 | tail -n 60 | tee voice-run.log
          echo "کلیپ‌های ضبط‌شده: $(ls app/src/main/res/raw/*.ogg 2>/dev/null | wc -l)"
          du -sh app/src/main/res/raw/

      # The signing key, out of a secret and onto the runner's disk for the length of the build.
      #
      # Without a fixed key every run signs with a fresh throwaway debug certificate, and then
      # Android will not install the new APK over the old one — the app looks broken when only
      # its signature changed. The key is never in the repo; it is base64 in HOOHOO_KEYSTORE_B64.
      - name: Unpack the signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.HOOHOO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=کلیدِ امضا نیست::این APK با کلیدِ موقت امضا می‌شود و روی گوشی‌ای که نسخه‌ی قبلی را دارد نصب نمی‌شود. رازِ HOOHOO_KEYSTORE_B64 را اضافه کن."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/hoohoo.p12"
          echo "ready=yes" >> "$GITHUB_OUTPUT"
          echo "کلیدِ امضا آماده شد ($(stat -c%s "$RUNNER_TEMP/signing/hoohoo.p12") بایت)"

      # Release, not debug — and that is not a detail.
      #
      # The lock on the paid chapters is a buildConfigField: off in debug so a chapter can be
      # worked on without buying it, on in release. Build the debug variant here and the APK
      # that reaches کافه‌بازار would hand the whole book out for nothing.
      - name: Build release APK
        id: build
        env:
          HOOHOO_KEYSTORE: ${{ steps.signing.outputs.ready == 'yes' && format('{0}/signing/hoohoo.p12', runner.temp) || '' }}
          HOOHOO_KEYSTORE_PASSWORD: ${{ secrets.HOOHOO_KEYSTORE_PASSWORD }}
          HOOHOO_KEY_ALIAS: ${{ secrets.HOOHOO_KEY_ALIAS }}
          HOOHOO_KEY_PASSWORD: ${{ secrets.HOOHOO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      # Why the build failed, somewhere it can actually be read.
      #
      # The runner's log lives on blob storage, which the development environment cannot reach,
      # so a failed compile used to be a wall: «failure» and nothing else. Annotations come back
      # from api.github.com, so the compiler's own lines are turned into annotations — and into
      # the run summary, for whoever is looking at the web page instead.
      - name: Say why the build failed
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "### بیلد شکست" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 8000 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # javac and AGP both print «…/File.java:12: error: …»; those lines are the whole story
          grep -E "error:|^e: |FAILURE:|Execution failed|Caused by:" /tmp/build.log \
            | head -n 25 > /tmp/build-errors.log || true
          if [ ! -s /tmp/build-errors.log ]; then
            tail -n 25 /tmp/build.log > /tmp/build-errors.log || true
          fi
          while IFS= read -r line; do
            printf '::error title=بیلد::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
          done < /tmp/build-errors.log

      # Which certificate signed it — the one number that says whether this APK installs over
      # the last one. It goes in the log and in the build summary, so a key that silently
      # changed can never again be found out from a phone.
      - name: Say who signed it
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          FINGERPRINT=$(python3 tools/apk_signer.py "$APK")
          echo "$FINGERPRINT"
          {
            echo "### امضای این APK"
            echo ""
            echo '```'
            echo "$FINGERPRINT"
            echo '```'
            if [ "${{ steps.signing.outputs.ready }}" != "yes" ]; then
              echo ""
              echo "⚠ کلیدِ ثابت داده نشده بود؛ این نسخه روی نصبِ قبلی به‌روزرسانی نمی‌شود."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Two names on purpose: a versioned one for the permanent release, and a fixed
      # "hoohoo-farsi.apk" so the download link on the latest release never changes.
      - name: Collect the APK
        id: collect
        run: |
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            # an unsigned release would be app-release-unsigned.apk, and installs nowhere
            echo "::error title=APK نیست::$APK ساخته نشد. فایل‌های موجود:"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK" "dist/${{ steps.version.outputs.apk }}"
          cp "$APK" dist/hoohoo-farsi.apk
          ls -lh dist/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoohoo-farsi-${{ steps.version.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      # Only the narration goes back into the repo. The APK does not: with four thousand
      # clips inside it, it is over GitHub's hard 100 MB limit for a file in a repository,
      # and the push is rejected — which used to take the release down with it. The release
      # is where the APK belongs anyway, and a release asset may be up to 2 GB.
      - name: Commit the narration into the repo
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/res/raw/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            voices=$(git diff --cached --name-only | grep -c 'res/raw/.*\.ogg' || true)
            git commit -m "گفتارِ نسخه‌ی ${{ steps.version.outputs.version }} (+$voices فایل صوتی)"
            git pull --rebase --autostash origin master || true
            git push
          fi

      # The fixed «latest» release is edited in place rather than deleted and recreated —
      # deleting the tag and immediately creating it again raced with GitHub and failed the
      # publish (the APK itself had already built and been committed).
      - name: Tag and publish the release
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          publish() {
            V="${{ steps.version.outputs.version }}"
            APK="dist/${{ steps.version.outputs.apk }}"
            NOTES="نسخه‌ی $V — ساخته‌شده از ${GITHUB_SHA::7}. مستقیم روی گوشی یا تبلت نصب می‌شود."

            # a permanent release per version…
            if gh release view "v$V" >/dev/null 2>&1; then
              gh release upload "v$V" "$APK" --clobber
            else
              gh release create "v$V" "$APK" --title "نسخه‌ی $V" --notes "$NOTES"
            fi

            # …and the fixed address the app is always published to:
            #   github.com/<repo>/releases/tag/latest
            #   github.com/<repo>/releases/download/latest/hoohoo-farsi.apk
            if gh release view latest >/dev/null 2>&1; then
              # drop the previous version's file so «latest» only ever carries the current one
              gh release view latest --json assets --jq '.assets[].name' \
                | grep -E '^hoohoo-farsi-.*\.apk$' \
                | grep -v -F "hoohoo-farsi-$V.apk" \
                | while read -r stale; do gh release delete-asset latest "$stale" --yes || true; done
              gh release upload latest dist/hoohoo-farsi.apk "$APK" --clobber
              gh release edit latest --title "آخرین نسخه ($V)" --notes "$NOTES" --prerelease
            else
              gh release create latest dist/hoohoo-farsi.apk "$APK" \
                --title "آخرین نسخه ($V)" --notes "$NOTES" --prerelease
            fi
          }

          for attempt in 1 2 3; do
            if publish 2>&1 | tee -a /tmp/release.log; then
              exit 0
            fi
            echo "تلاش $attempt ناموفق بود؛ ۱۵ ثانیه صبر می‌کنم." | tee -a /tmp/release.log
            sleep 15
          done
          exit 1

      # Actions logs live on storage the dev environment cannot reach, so a failed publish
      # writes its own reason somewhere readable: an issue.
      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 4000 /tmp/release.log 2>/dev/null \
                 || tail -c 4000 /tmp/build.log 2>/dev/null \
                 || echo "بدون لاگ")
          gh issue create \
            --title "انتشار نسخه‌ی ${{ steps.version.outputs.version }} ناموفق بود" \
            --body "$(printf 'ران: %s\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$TAIL")" || true
