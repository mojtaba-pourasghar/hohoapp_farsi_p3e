plugins {
    id 'com.android.application'
}

// Single source of truth for the version: the VERSION file at the repo root.
// versionCode is derived from it so it always climbs with the name.
def appVersionName = rootProject.file('VERSION').exists()
    ? rootProject.file('VERSION').text.trim()
    : '0.0.1'
def (vMajor, vMinor, vPatch) = (appVersionName.tokenize('.') + ['0', '0', '0'])[0..2]*.toInteger()

android {
    namespace 'com.hoohoofarsi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hoohoofarsi.app"
        minSdk 26
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.core:core:1.13.1'
}
